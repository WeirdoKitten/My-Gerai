name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Satu run per ref dalam satu waktu. PR membatalkan run lamanya, tetapi deploy di main tidak pernah
# dibatalkan di tengah pembuatan ulang container; push yang lebih baru menunggu giliran.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runner dikunci ke ubuntu-24.04 (bukan ubuntu-latest) supaya migrasi otomatis
# GitHub ke Ubuntu 26 tidak mengubah lingkungan CI tanpa disadari.
jobs:
  test:
    name: Test
    # Hanya jalan di repo deployment, bukan di fork/salinan repo ini.
    if: github.repository == 'WeirdoKitten/My-Gerai'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Versi Node sama dengan image produksi (Dockerfile: node:24-alpine).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # pnpm lewat corepack, versinya dari field "packageManager" di package.json
      # (sama seperti Dockerfile).
      - name: Enable pnpm
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format (Biome)
        run: pnpm exec biome check

      # Hanya unit test (tests/unit, tanpa database). Playwright sengaja tidak
      # dijalankan di CI karena butuh Postgres + server berjalan.
      - name: Unit test (Vitest)
        run: pnpm exec vitest run

  deploy:
    name: Deploy ke mini PC
    needs: test
    if: github.repository == 'WeirdoKitten/My-Gerai' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Service runner Windows di mini PC Beelink, berjalan sebagai user pemilik Docker Desktop.
    runs-on: [self-hosted, windows, mygerai]
    timeout-minutes: 45

    defaults:
      run:
        shell: powershell

    env:
      # Credential helper "desktop" milik Docker Desktop gagal di luar sesi desktop interaktif,
      # jadi runner memakai config polos tanpa kredensial.
      DOCKER_CONFIG: C:\mygerai\docker-config
      COMPOSE_ENV_FILE: C:\mygerai\compose.env
      BUILDKIT_PROGRESS: plain

    # Catatan Windows PowerShell 5.1 untuk semua step di bawah:
    # - Runner menambahkan $ErrorActionPreference = 'stop' di awal, yang mengubah baris stderr pertama
    #   perintah native (docker menulis progres ke sana) jadi error fatal. Tiap step mengembalikannya.
    # - "2>&1 | ForEach-Object { "$_" }" mencetak stderr sebagai teks biasa, bukan error record merah.
    # - Perintah native yang gagal tidak menggagalkan step, jadi $LASTEXITCODE dicek setelah tiap perintah.
    steps:
      - uses: actions/checkout@v4

      - name: Build dan jalankan stack
        run: |
          $ErrorActionPreference = 'Continue'
          docker compose -f deploy/compose.yml --env-file $env:COMPOSE_ENV_FILE up -d --build --remove-orphans --wait --wait-timeout 600 2>&1 | ForEach-Object { "$_" }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Status service
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          docker compose -f deploy/compose.yml --env-file $env:COMPOSE_ENV_FILE ps 2>&1 | ForEach-Object { "$_" }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Log terakhir
        if: failure()
        run: |
          $ErrorActionPreference = 'Continue'
          docker compose -f deploy/compose.yml --env-file $env:COMPOSE_ENV_FILE logs --tail=100 --no-color 2>&1 | ForEach-Object { "$_" }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Hapus image dangling
        run: |
          $ErrorActionPreference = 'Continue'
          docker image prune -f 2>&1 | ForEach-Object { "$_" }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Health check lewat Cloudflare
        run: |
          $ErrorActionPreference = 'Continue'
          curl.exe -fsS -o NUL --retry 10 --retry-delay 6 --retry-all-errors https://mygerai.myplaza.web.id/ 2>&1 | ForEach-Object { "$_" }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'https://mygerai.myplaza.web.id/ sehat'
